<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Isotipo circular de FITZONE</title>
  <desc id="desc">Símbolo circular abierto en verde lima, con un punto central y un segmento separado en el cuadrante inferior derecho.</desc>

  <g fill="none" stroke="#C6FF00" stroke-width="20" stroke-linecap="round">
    <!-- Arco principal abierto -->
    <path d="M96 29A43 43 0 1 0 45 105"/>
    <!-- Segmento inferior derecho -->
    <path d="M86 105A43 43 0 0 0 103 88"/>
  </g>

  <!-- Núcleo -->
  <circle cx="64" cy="64" r="15" fill="#C6FF00"/>
</svg>
